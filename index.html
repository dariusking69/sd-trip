<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C171C">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SD Trip">
  <title>SD Trip</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <!-- Trip code gate: nothing personal is in this page; the data loads only with the trip code. -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <svg class="gate-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="30" r="14" /><path d="M6 44c6 0 6-4 13-4s7 4 13 4 6-4 13-4 7 4 13 4" /><path d="M6 53c6 0 6-4 13-4s7 4 13 4 6-4 13-4 7 4 13 4" /></svg>
      <h1>SD Trip</h1>
      <p id="gate-msg">Open the link you were sent, or enter the trip code.</p>
      <form id="gate-form" autocomplete="off">
        <label for="gate-code" class="sr">Trip code</label>
        <input id="gate-code" name="code" type="text" inputmode="text" autocapitalize="off" spellcheck="false" placeholder="Trip code">
        <button type="submit" class="btn primary">Open the trip</button>
      </form>
    </div>
  </div>

  <div id="who" class="gate" hidden>
    <div class="gate-card">
      <h1>Whose phone is this?</h1>
      <p>So the budget knows who logged what.</p>
      <div class="who-row" id="who-row"></div>
    </div>
  </div>

  <div id="app">
    <header class="top">
      <div class="top-title">
        <span class="eyebrow" id="top-eyebrow">San Diego</span>
        <span class="top-day" id="top-day">&nbsp;</span>
      </div>
      <div class="top-actions">
        <span class="sync" id="sync" title="Sync status"><i></i><span id="sync-text">Loading</span></span>
      </div>
    </header>

    <main id="main">
      <section class="view" id="view-now" data-view="now" aria-label="Now"></section>
      <section class="view" id="view-map" data-view="map" aria-label="Map" hidden>
        <div id="map"></div>
        <div class="map-chips" id="map-chips" role="toolbar" aria-label="Show a day"></div>
        <button class="fab locate" id="locate" type="button" aria-label="Show where I am">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg>
        </button>
        <div class="map-card" id="map-card" hidden></div>
      </section>
      <section class="view" id="view-plan" data-view="plan" aria-label="Plan" hidden></section>
      <section class="view" id="view-budget" data-view="budget" aria-label="Budget" hidden></section>
      <section class="view" id="view-info" data-view="info" aria-label="Info" hidden></section>
    </main>

    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="now" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Now</span>
      </button>
      <button type="button" data-tab="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span>Map</span>
      </button>
      <button type="button" data-tab="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/></svg><span>Plan</span>
      </button>
      <button type="button" data-tab="budget">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="13" rx="2.5"/><path d="M3.5 10h17M15 14.5h2.5"/></svg><span>Budget</span>
      </button>
      <button type="button" data-tab="info">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></svg><span>Info</span>
      </button>
    </nav>
  </div>

  <!-- Add spending sheet -->
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet-scrim" data-close></div>
    <form class="sheet" id="add-form" autocomplete="off" novalidate>
      <div class="sheet-grab" aria-hidden="true"></div>
      <h2>Add spending</h2>
      <label class="field amount-field" for="f-amount"><span>Amount</span>
        <div class="amount-input"><b>$</b><input id="f-amount" name="amount" type="text" inputmode="decimal" placeholder="0.00" required></div>
      </label>
      <label class="field" for="f-what"><span>What was it</span>
        <input id="f-what" name="what" type="text" maxlength="120" placeholder="Tacos in Old Town">
      </label>
      <fieldset class="field">
        <legend>Who pays</legend>
        <div class="seg" id="f-payer">
          <button type="button" data-v="Us" class="on">Us</button>
          <button type="button" data-v="Atrium">Atrium (expense it)</button>
        </div>
      </fieldset>
      <fieldset class="field">
        <legend>Category</legend>
        <div class="chipset" id="f-cat"></div>
      </fieldset>
      <div class="two">
        <label class="field" for="f-card"><span>Paid with</span><select id="f-card" name="card"></select></label>
        <label class="field" for="f-date"><span>Date</span><input id="f-date" name="date" type="date"></label>
      </div>
      <p class="form-err" id="f-err" role="alert" hidden></p>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="config.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
